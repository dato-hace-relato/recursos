<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relato del Partido · Dato Hace Relato</title>
<meta name="description" content="Animaciones tiro a tiro de las eliminatorias del Mundial 2026, con ubicación y xG reales.">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
header { padding-top: 40px; }
.title-row { display: flex; align-items: center; gap: 16px; margin-top: 22px; }
.title-row img { width: 64px; height: 64px; border-radius: 50%; flex: none; }
h1 span { color: var(--gold); }
.lede { color: var(--ink-2); font-size: 16px; max-width: 640px; margin: 18px 0 0; text-wrap: pretty; }

main { padding-top: 32px; padding-bottom: 56px; }
.ronda { margin-bottom: 34px; }
.section-label { font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.match { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px 14px; text-decoration: none; color: inherit; transition: border-color var(--ease), background var(--ease), transform var(--ease); }
.match:hover { border-color: var(--gold); background: var(--panel-2); transform: translateY(-2px); }
.meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.meta .play { color: var(--gold); font-weight: 600; opacity: 0; transition: opacity var(--ease); }
.match:hover .play, .match:focus-visible .play { opacity: 1; }
@media (hover: none) { .meta .play { opacity: 1; } }
.team { display: flex; align-items: center; gap: 10px; padding: 3px 0; color: var(--ink-2); }
.team .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team .goals { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1; min-width: 1ch; text-align: right; }
.team.win { color: var(--ink); font-weight: 600; }
.team.win .goals { color: var(--gold); }

footer { border-top: 1px solid var(--line); padding-top: 20px; padding-bottom: 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header class="wrap">
  <a class="crumb" href="../">← Recursos</a>
  <div class="title-row">
    <img src="../logo-dhr.webp" alt="" width="64" height="64">
    <div>
      <p class="eyebrow">Mundial 2026 · Eliminatorias</p>
      <h1>Relato del <span>partido</span></h1>
    </div>
  </div>
  <p class="lede">Cada tiro del partido, minuto a minuto, con su ubicación y xG reales (Opta). Escoge un partido para ver la animación.</p>
</header>

<main class="wrap" id="rondas"></main>

<footer class="wrap">Dato Hace Relato · Datos: Opta.</footer>

<script src="partidos.js"></script>
<script>
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const equipo = ([nombre, flag], goles, gana) => `
  <div class="team${gana ? ' win' : ''}">
    <img class="flag" src="${bandera(flag)}" alt="" loading="lazy">
    <span class="name">${esc(nombre)}</span>
    <span class="goals">${goles}</span>
  </div>`;

document.getElementById('rondas').innerHTML = RONDAS.map(r => {
  const partidos = PARTIDOS.filter(p => p.ronda === r.id);
  return `
  <section class="ronda" aria-labelledby="h-${r.id}">
    <h2 class="section-label" id="h-${r.id}">${r.nombre}</h2>
    <div class="grid">
      ${partidos.map(p => `
      <a class="match" href="ver.html?p=${p.id}" aria-label="${esc(titulo(p))}">
        <div class="meta"><span>${p.fecha}</span><span class="play">Ver animación ▶</span></div>
        ${equipo(p.local, p.marcador[0], p.marcador[0] > p.marcador[1])}
        ${equipo(p.visita, p.marcador[1], p.marcador[1] > p.marcador[0])}
      </a>`).join('')}
    </div>
  </section>`;
}).join('');
</script>
</body>
</html>
